server {
    listen 80;
    server_name _;
    root /var/www/maccms;
    index index.php index.html;

    client_max_body_size 100M;

    # 演示素材：^~ 阻止 .jpg/.mp4 regex location 抢先匹配
    location ^~ /demo/ {
        alias /var/www/maccms/assets/static/;
        expires 7d;
    }
    location ^~ /static/ {
        alias /var/www/maccms/assets/static/;
        expires 7d;
    }

    # static assets with long cache
    location ~* \.(jpg|jpeg|png|gif|webp|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    # php-fpm（ThinkPHP5 PATH_INFO：api.php/provide/vod 也要走此规则）
    location ~ ^(.+?\.php)(/.+)?$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
